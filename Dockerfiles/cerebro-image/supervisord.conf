[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:prometheus]
command=/usr/local/bin/prometheus
    --config.file=/etc/prometheus/prometheus.yml
    --storage.tsdb.path=/prometheus
    --web.enable-lifecycle
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/prometheus.log
stderr_logfile=/var/log/supervisor/prometheus_err.log

[program:grafana]
command=/usr/share/grafana/bin/grafana-server
    --homepath=/usr/share/grafana
    --config=/etc/grafana/grafana.ini
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/grafana.log
stderr_logfile=/var/log/supervisor/grafana_err.log

[program:telegraf]
command=/usr/local/bin/telegraf --config /etc/telegraf/telegraf.conf
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/telegraf.log
stderr_logfile=/var/log/supervisor/telegraf_err.log

[program:sflow-rt]
command=/opt/sflow-rt/start.sh
directory=/opt/sflow-rt
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/sflow-rt.log
stderr_logfile=/var/log/supervisor/sflow-rt_err.log
