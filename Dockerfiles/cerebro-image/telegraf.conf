[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"

# ============================================================
# EDITA a "community" abaixo para bater certo com o que vais
# configurar em cada VyOS no próximo passo.
# ============================================================

[[inputs.snmp]]
  agents = [
    "192.168.0.1:161",     # Router 1 (RNORTH) - eth0, mesma sub-rede do Cérebro
    "192.168.16.1:161",    # Router 2 (RWEST)  - eth0, backbone
    "192.168.16.10:161",   # Router 3 (Rloc-1) - eth1, backbone
    "192.168.16.11:161",   # Router 4 (Rloc-2) - eth1, backbone
  ]
  version = 2
  community = "public"     # <-- EDITA: mesma community do VyOS
  interval = "10s"
  timeout = "5s"
  retries = 3
  name = "vyos"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = ".1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "uptime"
    oid = ".1.3.6.1.2.1.1.3.0"

  # Carga CPU (1, 5 e 15 min) - UCD-SNMP-MIB, disponível por padrão no VyOS
  [[inputs.snmp.field]]
    name = "cpu_load1"
    oid = ".1.3.6.1.4.1.2021.10.1.3.1"

  [[inputs.snmp.field]]
    name = "cpu_load5"
    oid = ".1.3.6.1.4.1.2021.10.1.3.2"

  [[inputs.snmp.field]]
    name = "cpu_load15"
    oid = ".1.3.6.1.4.1.2021.10.1.3.3"

  # Memória
  [[inputs.snmp.field]]
    name = "mem_total_kb"
    oid = ".1.3.6.1.4.1.2021.4.5.0"

  [[inputs.snmp.field]]
    name = "mem_avail_kb"
    oid = ".1.3.6.1.4.1.2021.4.6.0"

  # Tráfego por interface (bytes recebidos/enviados) - IF-MIB
  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = ["hostname"]

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = ".1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = ".1.3.6.1.2.1.2.2.1.10"

    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = ".1.3.6.1.2.1.2.2.1.16"

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
