global:
  scrape_interval: 5s
  evaluation_interval: 5s

# ============================================================
# EDITA OS TARGETS ABAIXO ANTES DE FAZER "docker build"
# Substitui os IPs/portas de exemplo pelos reais da tua topologia.
# ============================================================

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # --- cAdvisor: corre no host físico (Tese), alcançado via Cloud node -> docker0 ---
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - '172.17.0.1:8080'
        labels:
          topologia: 'gns3-iot'

  # --- Telegraf local (SNMP aos 4 routers VyOS, ver telegraf.conf) ---
  - job_name: 'telegraf-vyos'
    static_configs:
      - targets:
          - 'localhost:9273'
        labels:
          origem: 'snmp-vyos'

  # --- sFlow-RT: pendente até ao passo 4 (configurar OVS + confirmar
  #     a forma de expor as métricas em Prometheus) ---
  # - job_name: 'sflow-rt'
  #   static_configs:
  #     - targets: ['localhost:8008']
